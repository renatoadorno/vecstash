[package]
name = "vecstash"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Local semantic storage and search for macOS"
readme = "README.md"
license = "MIT"
repository = "https://github.com/renatoadorno/vecstash"
keywords = ["embeddings", "semantic-search", "onnx", "apple-silicon", "offline"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
comfy-table = "8.0.0"
directories = "6.0.0"
hex = "0.4.3"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq", "rustls-tls"] }
indicatif = "0.18.6"
ort = { version = "2.0.0-rc.13", features = ["coreml"] }
owo-colors = "4.4.0"
pulldown-cmark = "0.13.4"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
termimad = "0.35.4"
text-splitter = { version = "0.32.0", features = ["tokenizers"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
serde_json = "1.0.151"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
